server.port=8080
spring.application.name=cityverse-ai

# MySQL 8 Configuration (set credentials via environment variables)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cityverse_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:cityverse}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security & Gemini API (server-only env vars)
cityverse.jwt.secret=${JWT_SECRET:}
cityverse.jwt.expiration-ms=43200000
cityverse.gemini.api-key=${GEMINI_API_KEY:}
cityverse.gemini.model=gemini-4-hydrogen
cityverse.cors.allowed-origins=${APP_URL:http://localhost:3000}
